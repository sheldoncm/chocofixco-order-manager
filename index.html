<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <!-- Makes the webpage display correctly on mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Connects our CSS file to this HTML page -->
    <link rel="stylesheet" href="style.css">

    <!-- Text shown on the browser tab -->
    <title>ChocoFixCo Order Manager</title>
</head>

<body>

    <!-- ===== PAGE HEADER ===== -->
    <header>
        <h1>ChocoFixCo</h1>
        <p>Order & Production Manager</p>
    </header>


    <!-- ===== MAIN CONTENT ===== -->
    <main>

        <!-- ===== ADD ORDER SECTION ===== -->
        <section>

            <h2>Add New Order</h2>

            <!-- ===== ORDER FORM ===== -->
            <form id="order-form">

                <!-- ===== CUSTOMER NAME ===== -->
                <label for="customer-name">Customer Name</label>
                <input type="text" id="customer-name" required>


                <!-- ===== PRODUCT ===== -->
                <label for="product">Product</label>
                <input type="text" id="product" required>


                <!-- ===== QUANTITY ===== -->
                <!--
                    Minimum quantity = 1
                    Maximum quantity = 10

                    We use our own large - and + buttons.

                    The browser's small number arrows
                    will be hidden using CSS.

                    Later, the maximum can change
                    depending on the selected product.
                -->
                <label for="quantity">Quantity</label>

                <div class="quantity-control">

                    <!-- Decrease quantity -->
                    <button
                        type="button"
                        id="decrease-quantity"
                        aria-label="Decrease quantity">
                        −
                    </button>

                    <!-- Quantity input -->
                    <input
                        type="number"
                        id="quantity"
                        min="1"
                        max="10"
                        value="1"
                        required>

                    <!-- Increase quantity -->
                    <button
                        type="button"
                        id="increase-quantity"
                        aria-label="Increase quantity">
                        +
                    </button>

                    <!--
                        Shows the user the quantity limit.

                        This manages expectations instead of
                        making the user discover the limit
                        only after reaching it.
                    -->
                    <span class="quantity-limit">
                        Maximum 10
                    </span>

                </div>


                <!-- ===== ORDER STATUS ===== -->
                <label for="order-status">Order Status</label>
                <select id="order-status" required>
                    <option value="To Make">To Make</option>
                    <option value="Ready">Ready</option>
                    <option value="Completed">Completed</option>
                </select>


                <!-- ===== PAYMENT STATUS ===== -->
                <label for="payment-status">Payment Status</label>
                <select id="payment-status" required>
                    <option value="Unpaid">Unpaid</option>
                    <option value="Paid">Paid</option>
                </select>


                <!-- ===== COLLECTION DATE ===== -->
                <label for="collection-date">Collection Date</label>

                <input
                    type="date"
                    id="collection-date"
                    required>


                <!-- ===== SUBMIT BUTTON ===== -->
                <button type="submit">Add Order</button>

            </form>

        </section>


        <!-- ===== DASHBOARD / UI FEEDBACK ===== -->
        <section id="dashboard-section">
            <h2>Order Dashboard</h2>

            <div class="dashboard-cards">
                <div class="summary-card">
                    <span id="total-orders">0</span>
                    <p>Total Orders</p>
                </div>

                <div class="summary-card">
                    <span id="to-make-orders">0</span>
                    <p>To Make</p>
                </div>

                <div class="summary-card">
                    <span id="ready-orders">0</span>
                    <p>Ready</p>
                </div>

                <div class="summary-card">
                    <span id="completed-orders">0</span>
                    <p>Completed</p>
                </div>
            </div>
        </section>


        <!-- ===== ORDER LIST SECTION ===== -->
        <section id="orders-section">

            <h2>Orders</h2>

            <!-- JavaScript will later display orders here -->
            <div id="order-list">

                <p>No orders yet.</p>

            </div>

        </section>

    </main>


    <!-- =====================================================
         ===== JAVASCRIPT FILE ORDER =====
         =====================================================

         Axios = library used for AJAX / HTTP requests
         data.js = JSONBin API configuration
         script.js = application logic

         The order matters because script.js uses
         Axios and the constants from data.js.
    -->

    <!-- ===== AXIOS ===== -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <!-- ===== DATA / API CONFIGURATION ===== -->
    <script src="data.js"></script>

    <!-- ===== APPLICATION LOGIC ===== -->
    <script src="script.js"></script>

</body>

</html>
